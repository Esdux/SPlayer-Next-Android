# 提交到 main 即构建 Android R8 预发行版，并自动发布 GitHub Pre-release
name: Android Preview (R8)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 24.x
  PNPM_VERSION: 12.15.0
  GRADLE_VERSION: 9.7.1

# 同一分支的连续提交只保留最新一次构建
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & publish preview APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 前端产物要先进 android/app/src/main/assets，Gradle 才能一起打包
      - name: Build web assets
        run: pnpm exec vite build --config vite.android.config.ts

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest 预装 Android SDK 并设置 ANDROID_HOME，无需再装 setup-android
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>/dev/null | tail -3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # 仓库没有提交 gradlew，签名信息由 secrets 注入；缺失时自然落到未签名 release
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "ks.path=$(pwd)/release.keystore"
              echo "ks.alias=$KEY_ALIAS"
              echo "ks.pass=$KEYSTORE_PASSWORD"
            } >> local.properties
            echo "已写入签名配置，产物将使用上传的 keystore 签名"
          else
            echo "未配置 ANDROID_KEYSTORE_BASE64，产物为未签名 release APK"
          fi

      - name: Build R8 release
        working-directory: android
        run: gradle assembleRelease --console=plain

      - name: Compute preview version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version")
          VERSION="${BASE}-preview.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=android-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "预览版本：$VERSION"

      - name: Verify output
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          unzip -l "$APK" >/dev/null && echo "APK 结构正常"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: splayer-next-android-r8-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # 预发行：tag 带 preview 后缀并标记 prerelease，正式 release 仍由 v* 标签走 release.yml
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG"             "android/app/build/outputs/apk/release/app-release.apk#SPlayer-Next-Android-$VERSION.apk"             --prerelease             --title "Android 预览版 $VERSION"             --target "$GITHUB_SHA"             --notes "由提交 ${{ github.sha }} 自动构建的 R8 正式预览版（minify + shrinkResources）。
          安装前请确认与已装版本签名一致。"
